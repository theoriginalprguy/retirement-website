<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search - David Kirk</title>
  <meta name="description" content="Search David Kirk's website for articles, photos, projects, and more.">
  <meta name="theme-color" content="#ff6b35">

  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="icon" type="image/png" href="Images/favicon.png">

  <!-- Pagefind UI CSS -->
  <link rel="stylesheet" href="/pagefind/pagefind-ui.css">

  <style>
    .search-container {
      max-width: 800px;
      margin: 0 auto;
      width: 100%;
      box-sizing: border-box;
    }

    /* Customize Pagefind UI to match desert theme */
    :root {
      --pagefind-ui-scale: 1;
      --pagefind-ui-primary: var(--accent-vibrant);
      --pagefind-ui-text: var(--text);
      --pagefind-ui-background: var(--card);
      --pagefind-ui-border: var(--border);
      --pagefind-ui-tag: var(--bg);
      --pagefind-ui-border-width: 1px;
      --pagefind-ui-border-radius: var(--radius-lg);
      --pagefind-ui-image-border-radius: 8px;
      --pagefind-ui-image-box-ratio: 3 / 2;
      --pagefind-ui-font: inherit;
    }

    /* Input styling */
    .pagefind-ui__search-input {
      background: var(--card) !important;
      color: var(--text) !important;
      border: 1px solid var(--border) !important;
      border-radius: var(--radius-lg) !important;
      font-size: 1rem !important;
      padding: 14px 18px !important;
    }

    .pagefind-ui__search-input:focus {
      outline: none !important;
      border-color: var(--accent-vibrant) !important;
      box-shadow: 0 0 0 3px rgba(255, 107, 53, 0.15) !important;
    }

    /* Clear button */
    .pagefind-ui__search-clear {
      color: var(--muted) !important;
    }

    /* Results */
    .pagefind-ui__result {
      background: var(--card) !important;
      border: 1px solid var(--border) !important;
      border-radius: var(--radius-lg) !important;
      padding: 18px !important;
      margin-bottom: 16px !important;
      box-shadow: var(--shadow-soft) !important;
      transition: border-color 0.2s ease !important;
    }

    .pagefind-ui__result:hover {
      border-color: var(--accent-vibrant) !important;
    }

    .pagefind-ui__result-title {
      color: var(--accent-strong) !important;
    }

    .pagefind-ui__result-title a {
      color: var(--accent-strong) !important;
      text-decoration: none !important;
    }

    .pagefind-ui__result-title a:hover {
      color: var(--accent-vibrant) !important;
    }

    .pagefind-ui__result-excerpt {
      color: var(--text) !important;
      font-size: 0.95rem !important;
      line-height: 1.6 !important;
    }

    .pagefind-ui__result-excerpt mark {
      background: rgba(255, 107, 53, 0.2) !important;
      color: inherit !important;
      font-weight: 600 !important;
      padding: 1px 2px !important;
      border-radius: 2px !important;
    }

    /* Meta info (count, filters) */
    .pagefind-ui__message {
      color: var(--muted) !important;
      font-size: 0.95rem !important;
      margin-top: 16px !important;
      margin-bottom: 16px !important;
    }

    /* Button */
    .pagefind-ui__button {
      background: linear-gradient(135deg, var(--accent-vibrant), var(--accent-pink)) !important;
      color: white !important;
      border: none !important;
      border-radius: 999px !important;
      padding: 10px 24px !important;
      font-weight: 600 !important;
      cursor: pointer !important;
    }

    .pagefind-ui__button:hover {
      opacity: 0.9 !important;
    }

    @media (max-width: 600px) {
      .search-container {
        padding: 0;
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="site-wrapper">
    <div id="header-placeholder"></div>

    <div class="site-main">
      <main>
        <div class="page-kicker">Search</div>
        <h1>Find What You're Looking For</h1>
        <p class="lede">Search across articles, photos, and projects on this site.</p>

        <div class="search-container">
          <div id="search"></div>
        </div>

        <div class="story-card" style="margin-top: 40px;">
          <h2>Search Tips</h2>
          <ul style="margin-left: 20px; color: var(--text);">
            <li>Use specific keywords for better results</li>
            <li>Try different variations of your search terms</li>
            <li>Search works across all page content including headings and text</li>
          </ul>
        </div>
      </main>
    </div>

    <div id="footer-placeholder"></div>
  </div>

  <script src="shared.js"></script>

  <!-- Pagefind UI -->
  <script src="/pagefind/pagefind-ui.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', (event) => {
      const search = new PagefindUI({
        element: "#search",
        showSubResults: true,
        showImages: false,
        resetStyles: false,
        placeholder: "Search this site..."
      });

      // Auto-search if query parameter is present
      const urlParams = new URLSearchParams(window.location.search);
      const query = urlParams.get('q');
      if (query) {
        search.triggerSearch(query);
      }
    });
  </script>
</body>
</html>
